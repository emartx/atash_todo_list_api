# fly.toml app configuration file generated for atash-todo-list-api on 2025-03-31T18:17:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'atash-todo-list-api'
primary_region = 'ams'

[build]

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
